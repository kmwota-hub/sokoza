version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sokoza_postgres
    restart: always
    environment:
      POSTGRES_USER: sokoza_user
      POSTGRES_PASSWORD: sokoza_password
      POSTGRES_DB: sokoza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokoza_user -d sokoza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sokoza_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
